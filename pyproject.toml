[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-ai-brain"
version = "0.3.0"
description = "ULTRON — checkpoint training, evaluation and AI agent runtime"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ultron-api = "eclipse.api.server:main"
eclipse-api = "eclipse.api.server:main"

[tool.setuptools.packages.find]
include = ["eclipse*", "training*", "evals*"]